<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title-light desc-light">
  <title id="title-light">Mohammad Al-Najjar — Software Engineer</title>
  <desc id="desc-light">A minimal developer identity card with Mohammad Al-Najjar's portrait and software engineering focus.</desc>
  <defs>
    <clipPath id="portrait-light"><rect x="0" y="0" width="360" height="430" rx="28"/></clipPath>
    <linearGradient id="fade-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff00"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="edge-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0969da" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#d0d7de" stop-opacity=".25"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="430" rx="28" fill="#ffffff"/>
  <rect x=".75" y=".75" width="1198.5" height="428.5" rx="27.25" fill="none" stroke="url(#edge-light)" stroke-width="1.5"/>

  <image href="data:image/webp;base64," x="0" y="0" width="360" height="430" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait-light)"/>
  <rect x="260" y="0" width="180" height="430" fill="url(#fade-light)"/>

  <g transform="translate(370 44)">
    <text x="0" y="0" fill="#0969da" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="3">M/NAJJAR</text>
    <text x="0" y="46" fill="#1f2328" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="700" letter-spacing="-1">Mohammad Al-Najjar</text>
    <text x="2" y="74" fill="#656d76" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="600" letter-spacing="3.2">SOFTWARE ENGINEER</text>

    <line x1="0" y1="98" x2="770" y2="98" stroke="#d0d7de" stroke-width="1"/>

    <text x="0" y="132" fill="#656d76" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">$ focus</text>
    <text x="108" y="132" fill="#24292f" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">full-stack engineering · database systems · problem solving</text>

    <text x="0" y="164" fill="#656d76" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">$ stack</text>
    <text x="108" y="164" fill="#24292f" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">C++ · Java · Python · JavaScript · PHP</text>

    <text x="0" y="196" fill="#656d76" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">$ data</text>
    <text x="108" y="196" fill="#24292f" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">Oracle SQL · PostgreSQL · MySQL</text>

    <text x="0" y="228" fill="#656d76" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">$ now</text>
    <text x="108" y="228" fill="#24292f" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">Daleel Academy · building, learning, shipping</text>

    <line x1="0" y1="258" x2="770" y2="258" stroke="#d0d7de" stroke-width="1"/>

    <rect x="0" y="282" width="770" height="56" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="22" cy="310" r="5" fill="#1a7f37"/>
    <text x="38" y="315" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="1.5">BUILDING</text>
    <text x="132" y="315" fill="#656d76" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12">clear systems from strong fundamentals</text>
    <text x="650" y="315" fill="#0969da" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12">@mohammadalnajjar04</text>
  </g>
</svg>